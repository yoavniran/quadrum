name: Release

# Changesets-driven release for `quadrum` and `quadrum-react`.
#
# How it works:
#   1. Every PR that changes published code should add a changeset
#      (`pnpm changeset`) describing the bump. This is not enforced -- ci.yml's
#      "changeset" job only warns, since docs/CI-only PRs legitimately have none.
#   2. On push to main, this workflow opens/updates a "Version Packages" PR that
#      applies the pending changesets: bumps versions, rewrites CHANGELOG.md,
#      deletes the consumed changeset files. The PR title names the version it
#      would release, and the run summary spells out every bump.
#   3. Merging that PR runs this workflow again; now there are no pending
#      changesets, so the action publishes the packages to npm instead and tags
#      the release on GitHub.
#
# Authentication is npm **trusted publishing** (OIDC): there is no NPM_TOKEN.
# npm verifies this workflow's identity directly and attaches provenance.
#
# ONE-TIME SETUP, required before the first automated publish. None of this is in
# the repo -- it is all account and repository configuration. See the "Publishing
# setup" section of readme.md for the full walkthrough.
#
#   1. GitHub -> repo Settings -> Actions -> General -> Workflow permissions:
#      tick "Allow GitHub Actions to create and approve pull requests".
#      WITHOUT THIS, step 2 above fails. The action pushes changeset-release/main
#      successfully and then dies on:
#        "GitHub Actions is not permitted to create or approve pull requests."
#      The `pull-requests: write` permission below is necessary but NOT sufficient
#      -- this org/repo toggle overrides it, and defaults to off.
#   2. Both packages must already exist on npm. Trusted publishing is configured
#      per existing package, and a package that has never been published has no
#      settings page to configure -- so the first publish must be manual:
#        pnpm build
#        cd packages/core && npm publish          # core first: react peer-depends on it
#        cd ../react && npm publish
#   3. Then on npmjs.com, for each of `quadrum` and `quadrum-react`:
#      Settings -> Trusted publishers -> GitHub Actions, with
#      repository `yoavniran/quadrum` and workflow `release.yml`.
#
# There is deliberately no NPM_TOKEN secret. Do not add one -- OIDC replaces it.
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Push the version branch and create GitHub releases.
      contents: write
      # Open the "Version Packages" PR.
      pull-requests: write
      # Mint the OIDC token npm trades for publish rights. Without this,
      # trusted publishing fails with an authentication error.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Changesets reads history to work out what changed since the last tag.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; don't rely on whatever npm the
      # Node image happens to bundle.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release must not be able to ship something that doesn't compile.
      - name: Verify
        run: |
          pnpm typecheck
          pnpm test

      # changesets/action takes the PR title as a *static* input, resolved before
      # `changeset version` ever runs -- so for the title to name the version, the
      # version has to be worked out first. `changeset status` builds the same
      # release plan and only reports it; it writes nothing, and exits 0 with an
      # empty plan on a publish run, where the title is unused anyway.
      #
      # The plan goes to RUNNER_TEMP, not the workspace: changesets/action commits
      # what it finds in the tree, and a stray file would land in the version PR.
      - name: Work out the pending version
        id: pending
        run: |
          pnpm exec changeset status --output="$RUNNER_TEMP/changeset-status.json"
          node .github/scripts/write-release-report.mjs pending "$RUNNER_TEMP/changeset-status.json"

      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: ${{ steps.pending.outputs.title }}
          commit: ${{ steps.pending.outputs.commit }}
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Which half ran is only known afterwards, so both are summarised here.
      # The action's outputs reach the script through env rather than string
      # interpolation: they carry JSON, and one of them is package metadata.
      - name: Summarise the release
        if: always() && steps.pending.outcome == 'success'
        run: node .github/scripts/write-release-report.mjs summary
        env:
          PENDING_PACKAGES: ${{ steps.pending.outputs.packages }}
          PENDING_VERSION: ${{ steps.pending.outputs.version }}
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
