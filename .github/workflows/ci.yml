name: CI

# Quality gate for every change headed to main: type-check, unit tests, and a real
# bundler build of the demo app. Make this a *required* status check in the repo's
# branch-protection rules so PRs can't merge until it's green.
#
# The demo build is not busywork: inside the repo the packages are aliased to their
# TypeScript source, so `apps/demo` building under Vite is the only proof that a real
# bundler can compile that source end to end.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm before node, so setup-node's pnpm cache has a package manager to query.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root script uses --no-bail, so a failure in core still reports react and demo.
      - name: Type-check (core, react, demo)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the publishable packages
        run: pnpm build

      - name: Build the demo app
        run: pnpm --filter quadrum-demo build

  # The only job that exercises quadrum in a real browser. Everything else runs in
  # jsdom, which has no layout and no pointer events -- so percentage positioning,
  # the drag threshold and the mark pens are unobserved until this runs. Its own
  # job rather than a step in `verify`: it needs a browser download, it is the
  # slowest thing here, and its failures should read as browser failures.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer starts the demo on 5273 and tears it down after.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Conventional Commits, enforced. The local .husky/commit-msg hook catches these
  # at commit time, but a hook is opt-in -- it only exists for someone who ran
  # `pnpm install`, and `--no-verify` skips it -- so this is the check that actually
  # holds. Rules live in commitlint.config.js, shared by both.
  #
  # Both halves matter because they cover different merge strategies: the commit
  # range is what lands on a merge commit or a rebase, and the PR title is what
  # lands as the subject of a squash merge.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: commitlint walks the range base..HEAD, which a shallow
        # clone cannot resolve.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the PR's commit messages
        run: pnpm exec commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

      - name: Lint the PR title
        # The title is attacker-controlled text from a fork, so it goes through the
        # environment rather than being interpolated into the script, where a
        # backtick or $(...) would execute as part of this step.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  # Advisory only, and now doubly so: release.yml generates a changeset for any
  # commit that changed published source without one, so a missing changeset can
  # no longer lose a release -- it only costs that change its prose, since the
  # generated entry is a commit subject rather than an explanation. Docs-, test-
  # and CI-only PRs legitimately have none, so this never fails the build.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Warn when published packages changed with no changeset
        run: |
          base="origin/${{ github.base_ref }}"
          # The same published paths write-auto-changeset.mjs watches: the bytes
          # that go in the tarball, README included.
          changed=$(git diff --name-only "$base"...HEAD -- packages/core/src packages/react/src packages/core/README.md packages/react/README.md)
          added=$(git diff --name-only "$base"...HEAD -- .changeset | grep -E '\.changeset/.+\.md$' || true)
          if [ -n "$changed" ] && [ -z "$added" ]; then
            echo "::warning::Published files changed with no changeset. The release will generate one from the commit subject; run 'pnpm changeset' to write a better entry yourself."
          else
            echo "Changeset check OK."
          fi
