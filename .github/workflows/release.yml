name: Release

# release-please-driven release for `quadrum` and `quadrum-react`.
#
# How it works:
#   1. Every commit that reaches main is read as a Conventional Commit. The type
#      decides the bump (feat -> minor, fix/perf/build -> patch, `!` or a
#      BREAKING CHANGE footer -> minor while pre-1.0), and the subject becomes a
#      changelog line. Nothing is authored by hand -- there is no changeset file
#      to forget, and a PR that needs no release simply has no releasable commit.
#   2. release-please keeps a "chore: release X.Y.Z" PR open with the pending
#      CHANGELOG.md and package.json edits. It rewrites that PR on every push.
#   3. Merging it tags `quadrum@X.Y.Z` / `quadrum-react@X.Y.Z`, creates the GitHub
#      releases, and sets `releases_created` -- which is what gates the publish
#      job below.
#
# Which commits count for which package is decided by *path*: only commits that
# touch `packages/core/**` can release `quadrum`. A `fix(bench):` on the
# benchmark app releases nothing, which is the behaviour changesets could only
# approximate by asking a human to remember.
#
# Authentication is npm **trusted publishing** (OIDC): there is no NPM_TOKEN.
# npm verifies this workflow's identity directly and attaches provenance.
#
# ONE-TIME SETUP, required before the first automated publish. None of this is in
# the repo -- it is all account and repository configuration. See the "Publishing
# setup" section of readme.md for the full walkthrough.
#
#   1. GitHub -> repo Settings -> Actions -> General -> Workflow permissions:
#      tick "Allow GitHub Actions to create and approve pull requests".
#      WITHOUT THIS, step 2 above fails: release-please pushes its release branch
#      successfully and then dies on
#        "GitHub Actions is not permitted to create or approve pull requests."
#      The `pull-requests: write` permission below is necessary but NOT sufficient
#      -- this org/repo toggle overrides it, and defaults to off.
#   2. Both packages must already exist on npm. Trusted publishing is configured
#      per existing package, and a package that has never been published has no
#      settings page to configure -- so the first publish must be manual:
#        pnpm build
#        cd packages/core && npm publish          # core first: react peer-depends on it
#        cd ../react && npm publish
#   3. Then on npmjs.com, for each of `quadrum` and `quadrum-react`:
#      Settings -> Trusted publishers -> GitHub Actions, with
#      repository `yoavniran/quadrum` and workflow `release.yml`.
#
# There is deliberately no NPM_TOKEN secret. Do not add one -- OIDC replaces it.
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or refreshes the release PR. On the push that *merges* that PR, it
  # instead cuts the tags and GitHub releases and reports which packages moved.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # Push the release branch and create tags and GitHub releases.
      contents: write
      # Open the release PR.
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      core_released: ${{ steps.release.outputs['packages/core--release_created'] }}
      react_released: ${{ steps.release.outputs['packages/react--release_created'] }}
    steps:
      # No checkout: the action reads history and writes its branch through the
      # API, so a working copy would only be dead weight.
      - name: Release PR or tag
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Runs only on the push that merged a release PR, so `github.sha` is the
  # release commit and the versions in the tree are the ones just tagged.
  publish:
    needs: prepare
    if: needs.prepare.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mint the OIDC token npm trades for publish rights. Without this,
      # trusted publishing fails with an authentication error.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; don't rely on whatever npm the
      # Node image happens to bundle.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release is already tagged by the time this runs, so a failure here
      # means a bad tag rather than a bad publish -- but shipping a package that
      # doesn't compile is strictly worse than a tag with no tarball behind it.
      - name: Verify
        run: |
          pnpm typecheck
          pnpm test

      - name: Build
        run: pnpm build

      # `pnpm publish` rather than `npm publish`: react devDepends on
      # `quadrum: workspace:*`, and only pnpm rewrites that protocol to a real
      # version on the way into the tarball. --no-git-checks because the runner
      # is on a detached HEAD, which pnpm otherwise refuses to publish from.
      #
      # Core first: quadrum-react peer-depends on it, so a consumer installing
      # the pair in the window between the two must not find react pointing at a
      # version that isn't on the registry yet.
      - name: Publish quadrum
        if: needs.prepare.outputs.core_released == 'true'
        working-directory: packages/core
        run: pnpm publish --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish quadrum-react
        if: needs.prepare.outputs.react_released == 'true'
        working-directory: packages/react
        run: pnpm publish --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
