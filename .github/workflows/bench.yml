name: Benchmarks

# quadrum vs chessground, measured rather than asserted. Its own workflow rather
# than a job in ci.yml: ci.yml's stated contract is "quality gate for every
# change" with every job cheap and deterministic, and a benchmark that can
# legitimately return *inconclusive* does not belong to that. It also needs a
# schedule, a workflow_dispatch and a paths filter that ci.yml's other jobs must
# not inherit.
#
# What runs when:
#
#   PR touching packages/*/src, apps/bench or the report scripts
#     -> blocking, gated scenarios only
#   push to main
#     -> blocking, gated scenarios only
#   nightly
#     -> all 8 scenarios, publishable, never blocks, opens a refresh PR --
#        unless nothing that can move a number has changed since the published
#        run and those numbers are still fresh, in which case it skips (see
#        should-run)
#   workflow_dispatch
#     -> full run at the repetitions you type; with mint_baseline, also opens a
#        PR committing the run as the gate baseline plus its raw evidence
#
# Methodology, the gate rules and the rebaseline checklist: apps/bench/README.md
on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/*/src/**"
      - "apps/bench/**"
      - ".github/workflows/bench.yml"
      - ".github/scripts/bench-*.mjs"
      - ".github/scripts/write-bench-report.mjs"
  push:
    branches:
      - main
    paths:
      - "packages/*/src/**"
      - "apps/bench/**"
      - ".github/workflows/bench.yml"
      - ".github/scripts/bench-*.mjs"
      - ".github/scripts/write-bench-report.mjs"
  schedule:
    # 03:17 UTC. Off the hour on purpose -- the top of the hour is the busiest
    # slot on shared runners, and a noisy neighbour is measurement error here.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repetitions:
        # 31 matches the nightly -- the run that is publishable and feeds the
        # README -- because most dispatches are "show me where we stand", and at
        # 31 that answer costs the better part of an hour for confidence
        # intervals that were already degenerate at 31.
        description: "Repetitions (type 31 when minting a baseline)"
        required: false
        default: "31"
      mint_baseline:
        # Opt-in, and still merged by a human. The rule the README states is "no
        # auto-rebaselining bot", because a gate that records whatever happened is
        # a ratchet; asking for a baseline explicitly and then reviewing the ratio
        # diff in a PR is not that. What this removes is only the undocumented
        # manual step in the middle -- download the artifact, find the JSON, run
        # the CLI locally -- which is exactly where a dispatch run's evidence has
        # been going to die.
        description: "Also open a PR committing this run as the gate baseline (pair with 31)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Cancels superseded PR runs, but never a scheduled one: a half-measured
  # nightly is worse than a late one, and the nightly is what feeds the README.
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Schedule only: decides whether tonight's nightly would measure anything new.
  # A full nightly is 31 repetitions across 8 scenarios and costs the better part
  # of half an hour of runner time, and re-measuring a main that has not moved
  # buys a number nobody will read.
  #
  # The two halves of the rule are both load-bearing, and the second is the one
  # that looks removable and is not. Skipping on "main did not move" alone would
  # let the published block age, because this is the only run allowed to refresh
  # it -- and the drift job fails outright once those numbers pass
  # FRESHNESS_FAIL_DAYS, on every event, with no paths filter. That failure would
  # land on unrelated PRs, over numbers nobody edited, in a job whose message
  # points at the README rather than at here. So the skip expires: see
  # NIGHTLY_REFRESH_DAYS in bench-report.mjs.
  #
  # Everything undecidable measures. This job going red does not stop the
  # nightly -- `bench` reads its output as "not false" precisely so that a
  # failure here cannot silently cancel the schedule.
  should-run:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        # fetch-depth: 0 -- the published run's commit is as old as the last
        # nightly that published, which a shallow clone will not contain.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Decide whether there is anything new to measure
        id: decide
        run: |
          # The published run records the commit it measured, so the diff needs
          # no state file of its own -- the evidence is the state.
          sha="$(node -p "(require('./apps/bench/results/latest.json').env || {}).gitSha || ''" 2>/dev/null || true)"

          # Nothing published yet, or a commit this clone cannot resolve because
          # history was rewritten under it. Either way the comparison is
          # undecidable, and an undecidable comparison measures.
          if [ -z "$sha" ] || ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "::notice::No resolvable published commit to diff against; measuring."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$sha" HEAD > changed-files.txt
          node .github/scripts/write-bench-report.mjs should-run \
            --files changed-files.txt \
            --published apps/bench/results/latest.json

  # Fails a PR that updates the gate baseline in the same change as library
  # source. That single diff is invisible to every other check in the repo,
  # because the new baseline is what the gate compares against.
  guard-baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Collect the changed files
        run: git diff --name-only "origin/${{ github.base_ref }}"...HEAD > changed-files.txt

      - name: Guard the baseline
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/write-bench-report.mjs guard-baseline --files changed-files.txt

  # Regenerates the README's headline block from the committed results and fails
  # if it differs. This is what makes a hand-edited number break the build: a
  # figure that is not in the JSON cannot survive here. Also fails once the
  # published numbers pass 120 days old.
  #
  # No-ops until the first nightly run commits a results file -- there is nothing
  # to check against before that, and a check that fails for lack of data teaches
  # people to ignore it.
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the README against the published results
        run: |
          if [ ! -f apps/bench/results/latest.json ]; then
            echo "No published run committed yet; nothing to check."
            exit 0
          fi
          node .github/scripts/write-bench-report.mjs check \
            apps/bench/results/latest.json --readme README.md

  bench:
    needs: should-run
    # `!= 'false'` rather than `== 'true'`, and `!cancelled()` rather than
    # letting `needs` imply success. should-run is skipped for every event except
    # the schedule, and a skipped job's output is the empty string -- so only an
    # explicit "false" from a decision that actually ran can stop the benchmark.
    # A crash in should-run measures, which is the same fail-open rule the
    # decision itself follows.
    if: ${{ !cancelled() && needs.should-run.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      # Read by mint-baseline, which runs even when the gate went red -- so the
      # baseline PR can state plainly that the run it was minted from failed
      # against the baseline it replaces. `gate` is the first pass; `confirm` is
      # the re-measurement, and it is the one that decides (see below).
      gate: ${{ steps.gate.outcome }}
      confirm: ${{ steps.confirm.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the benchmark app
        run: pnpm --filter quadrum-bench build

      # BENCH_TRIGGER is what decides `publishable` in the record, and the
      # renderer throws on a non-publishable run. PR runs are noisy and
      # re-runnable, so they can never reach the README.
      - name: Run the benchmarks
        env:
          BENCH_TRIGGER: ${{ github.event_name }}
        run: |
          # No `--` before the flags: `pnpm run` forwards it verbatim through the
          # nested workspace script, so the runner would receive a bare `--` as
          # its first argument.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            pnpm bench --scenario gated --runs 7
          else
            pnpm bench --runs "${{ github.event.inputs.repetitions || 31 }}"
          fi

      # always(): the raw JSON is the evidence, and it is most wanted precisely
      # when the run failed.
      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.run_id }}
          path: apps/bench/results/
          retention-days: 30

      - name: Gate against the baseline
        id: gate
        # Never blocking on its own, because a first-pass failure is not the
        # verdict -- a confirmable one is re-measured below, and the design is
        # that the gate is red only if the second pass agrees. Left blocking,
        # this step's exit code marked the job failed the instant it fired, so
        # the 2026-08-15 run stayed red even though the confirm pass came back
        # green and printed "Benchmark gate: pass". The verdict is still
        # computed, still printed and still in `outcome`; "Decide the verdict"
        # below is what fails the job.
        continue-on-error: true
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          # Until a baseline is minted from a workflow_dispatch run on main
          # (see the rebaseline checklist in apps/bench/README.md), there is
          # nothing to compare against. The run still happens and still uploads
          # its evidence -- it just cannot return a verdict yet.
          if [ ! -f apps/bench/results/baseline.json ]; then
            echo "::notice::No baseline committed yet; skipping the gate. Mint one with a workflow_dispatch run at 31 repetitions."
            exit 0
          fi
          node .github/scripts/write-bench-report.mjs gate \
            apps/bench/results/latest.json \
            apps/bench/results/baseline.json

      # Paid only on failure, and it removes the incentive to hit "re-run job" --
      # which is itself a laundering vector. Only the scenarios that failed are
      # re-measured, in a fresh context at higher repetitions, and the gate is
      # only red if the second pass agrees.
      #
      # Skipped when the gate reports no re-measurable failure. A baseline that
      # gates a metric nothing headlines any more cannot be argued with by
      # measuring harder, and re-running it spends benchmark minutes to reprint
      # the same sentence -- six of them on the 2026-08-12 PR run. This decides
      # whether a second measurement could inform the verdict. When it is
      # skipped there is nothing to overturn the first pass, so the failure
      # stands.
      - name: Confirm a failure before believing it
        id: confirm
        if: steps.gate.outcome == 'failure' && steps.gate.outputs.confirmable == 'true'
        # The verdict belongs to "Decide the verdict"; this step only measures.
        continue-on-error: true
        env:
          BENCH_TRIGGER: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          echo "::notice::Gate failed; re-measuring the gated scenarios at 25 repetitions to confirm."
          pnpm bench --scenario gated --runs 25 --out results/confirm.json
          node .github/scripts/write-bench-report.mjs gate \
            apps/bench/results/confirm.json \
            apps/bench/results/baseline.json

      - name: Write the full report to the step summary
        if: always()
        run: |
          node .github/scripts/write-bench-report.mjs summarize \
            apps/bench/results/latest.json >> "$GITHUB_STEP_SUMMARY" || true

      # The single place the job's red/green is decided, so that "red only if the
      # second pass agrees" is one readable rule rather than an emergent property
      # of two steps' exit codes.
      - name: Decide the verdict
        if: always()
        env:
          GATE: ${{ steps.gate.outcome }}
          CONFIRM: ${{ steps.confirm.outcome }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$GATE" != "failure" ]; then
            exit 0
          fi

          # The nightly is documented as "never blocks" -- it is a report that
          # feeds the README, and the publish job needs this job green to run at
          # all. Left blocking, a stale baseline stops the published numbers
          # refreshing, which is the opposite of what the nightly is for.
          if [ "$IS_SCHEDULE" = "true" ]; then
            echo "::notice::Gate failed, but the nightly never blocks. See the step summary."
            exit 0
          fi

          # A confirm pass that came back green overturns the first one. Anything
          # else -- it also failed, or it never ran because nothing was
          # re-measurable -- leaves the failure standing.
          if [ "$CONFIRM" = "success" ]; then
            echo "::notice::First pass failed; the 25-repetition confirm pass did not agree, so the gate is green."
            exit 0
          fi

          echo "::error::Benchmark gate failed (first pass: $GATE, confirm pass: $CONFIRM)."
          exit 1

  # Schedule only. The nightly is the only run whose numbers may reach the
  # README, and even then a human merges the PR.
  publish:
    needs: bench
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          name: bench-results-${{ github.run_id }}
          path: apps/bench/results/

      # Throws on a non-publishable run, on a stale run, and on missing markers.
      - name: Splice the headline block into the README
        run: |
          node .github/scripts/write-bench-report.mjs publish \
            apps/bench/results/latest.json --readme README.md

      - name: Open the refresh PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bench/refresh-numbers
          title: "docs: refresh the published benchmark numbers"
          commit-message: "docs: refresh the published benchmark numbers"
          add-paths: |
            README.md
            apps/bench/results/latest.json
          body: |
            Generated by the nightly benchmark run.

            Every number here comes from `apps/bench/results/latest.json` and the block is
            regenerated, never hand-edited — a CI drift check fails if the README and the JSON
            disagree. Review the ratios, not the absolute milliseconds: those move with the
            runner.

            Methodology: `apps/bench/README.md`.

  # Dispatch only, and only when asked for. Deliberately separate from `publish`:
  # the README block and the gate baseline are different products with different
  # review questions, and apps/bench/README.md's rebaseline checklist says never
  # to move both in one PR. This job therefore never touches README.md or
  # latest.json -- latest.json is what the drift check reads the README against,
  # and a dispatch run is `publishable: false` precisely so its numbers cannot
  # reach the published table.
  #
  # It commits two files. baseline.json is what the gate compares against, but it
  # keeps only the headline metric of each gated scenario -- so baseline-run.json
  # carries the whole record beside it: raw samples, dispersion, the non-gated
  # scenarios, the CPU model and throttle rate. Without that, "the baseline moved"
  # is unanswerable six months later, and a before/after around a performance fix
  # has nothing to diff against.
  mint-baseline:
    needs: bench
    # `!cancelled()` rather than `success()`, deliberately. Minting is how a
    # baseline that no longer describes the measurement gets replaced -- and a
    # baseline in that state is exactly one whose gate is red. Gating minting on a
    # green gate makes the two conditions circular: the only run that may mint is
    # one that did not need to.
    #
    # It is not a laundering route. The mint still opens a PR a human merges, the
    # gate verdict is carried into that PR's body below, and the `bench-rebaseline`
    # label rule still fails any baseline change that rides along with library
    # source. What this removes is a deadlock, not a review.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mint_baseline }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          name: bench-results-${{ github.run_id }}
          path: apps/bench/results/

      # A gated scenario whose CI half-width exceeds the cap is demoted to
      # reported-only rather than failing the mint -- the demotion shows up in the
      # baseline PR diff and the step summary, and the fix is to quiet the noise,
      # never to widen the tolerance. The mint only fails outright when every
      # gated timing scenario is that noisy: such a run measured the machine.
      - name: Mint the baseline
        run: |
          node .github/scripts/write-bench-report.mjs baseline \
            apps/bench/results/latest.json \
            --out apps/bench/results/baseline.json
          cp apps/bench/results/latest.json apps/bench/results/baseline-run.json

      - name: Summarize the run into the step summary
        run: |
          node .github/scripts/write-bench-report.mjs summarize \
            apps/bench/results/latest.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open the baseline PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bench/mint-baseline
          title: "chore: mint the benchmark gate baseline"
          commit-message: "chore: mint the benchmark gate baseline"
          add-paths: |
            apps/bench/results/baseline.json
            apps/bench/results/baseline-run.json
          body: |
            Minted from the `workflow_dispatch` run that requested it. Merging this changes what
            every later benchmark run is gated against, so it is a review, not a formality.

            Gate verdict of the run this was minted from, measured against the baseline it
            replaces: **${{ needs.bench.outputs.gate }}** (confirm pass:
            `${{ needs.bench.outputs.confirm }}`, `skipped` when the first pass had nothing worth
            re-measuring). A `failure` there is not a reason to
            skip the review — it is the reason to do it. Either the old baseline stopped
            describing the measurement (mint), or something genuinely regressed (do not mint,
            fix it). The step summary of run ${{ github.run_id }} says which scenarios failed.

            Before approving, work through the rebaseline checklist in `apps/bench/README.md`:

            - Every changed ratio needs a sentence saying why it moved. A ratio that moved for a
              reason nobody can state is a regression being recorded rather than fixed.
            - If this PR is paired with a change under `packages/*/src`, it needs the
              `bench-rebaseline` label, and a reviewer should read the source diff and the ratio
              diff together — that pairing is the single diff no other check in the repo can see.

            `baseline-run.json` is the full record the baseline was derived from — raw samples,
            dispersion, the non-gated scenarios, and the runner's CPU model and throttle rate.
            It is evidence, not input: nothing reads it, and it is what makes a future "why did
            this move?" answerable.
