name: CI

# Quality gate for every change headed to main: type-check, unit tests, and a real
# bundler build of the demo app. Make this a *required* status check in the repo's
# branch-protection rules so PRs can't merge until it's green.
#
# The demo build is not busywork: inside the repo the packages are aliased to their
# TypeScript source, so `apps/demo` building under Vite is the only proof that a real
# bundler can compile that source end to end.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm before node, so setup-node's pnpm cache has a package manager to query.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root script uses --no-bail, so a failure in core still reports react and demo.
      - name: Type-check (core, react, demo)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the publishable packages
        run: pnpm build

      - name: Build the demo app
        run: pnpm --filter quadrum-demo build

  # The only job that exercises quadrum in a real browser. Everything else runs in
  # jsdom, which has no layout and no pointer events -- so percentage positioning,
  # the drag threshold and the mark pens are unobserved until this runs. Its own
  # job rather than a step in `verify`: it needs a browser download, it is the
  # slowest thing here, and its failures should read as browser failures.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser binary is the cacheable half of the install; the `--with-deps`
      # apt-get is not, and it is the half that goes wrong -- it re-resolves ~40
      # font and library packages off the Ubuntu mirror on every single run, and
      # a slow mirror has turned this step into an 8-minute stall. So: restore
      # the binary from cache, and only pay for apt when there was nothing to
      # restore. The runner image already ships the shared libraries Chromium
      # links against; the packages we skip on a hit are almost entirely fonts,
      # and no spec here asserts on pixels.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile because that is what pins the Playwright
          # version, and the browser build is chosen by that version.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Two steps rather than one with a conditional argument: in a GitHub
      # expression the empty string is falsy, so the obvious
      # `cache-hit && '' || '--with-deps'` collapses to `--with-deps` on a hit
      # and silently buys nothing.
      - name: Install Playwright browser and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the cached Playwright browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium

      # Playwright's webServer starts the demo on 5273 and tears it down after.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Conventional Commits, enforced. The local .husky/commit-msg hook catches these
  # at commit time, but a hook is opt-in -- it only exists for someone who ran
  # `pnpm install`, and `--no-verify` skips it -- so this is the check that actually
  # holds. Rules live in commitlint.config.js, shared by both.
  #
  # Both halves matter because they cover different merge strategies: the commit
  # range is what lands on a merge commit or a rebase, and the PR title is what
  # lands as the subject of a squash merge.
  #
  # Under release-please this is load-bearing, not cosmetic: the type on the
  # commit that lands is what picks the version bump and writes the changelog
  # line. A `chore:` where a `fix:` belonged ships nothing.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: commitlint walks the range base..HEAD, which a shallow
        # clone cannot resolve.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the PR's commit messages
        run: pnpm exec commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

      - name: Lint the PR title
        # The title is attacker-controlled text from a fork, so it goes through the
        # environment rather than being interpolated into the script, where a
        # backtick or $(...) would execute as part of this step.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
